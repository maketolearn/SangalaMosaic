# Every push to main rebuilds SangalaMosaic.exe if its source changed and publishes Sangala Mosaic to the Dropbox
# Sangala Tools folder. The steps are shared with the other Sangala applications and live once, in
# maketolearn/SangalaStudio (.github/workflows/sangala-release.yml). "Run workflow" on the Actions
# tab does the same by hand.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: maketolearn/SangalaStudio/.github/workflows/sangala-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      app: Mosaic
      exe: SangalaMosaic.exe
      page: SangalaMosaic.html
      build_cmd: Build SangalaMosaic Launcher.cmd
      engine_files: |
        SangalaMosaicLauncher.cs
        Turaco.ico
        Build SangalaMosaic Launcher.cmd
